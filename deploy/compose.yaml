# Lotse for a team: the builder and PostgreSQL.
#
#   cp .env.example .env    # then fill in the values
#   sudo install -d -o 1000 -g 1000 /srv/lotse
#   docker compose up -d
#
# The builder listens on 127.0.0.1:4780. Put a reverse proxy with TLS in front of it for
# the builder's address and for the wildcard preview domain (docs/self-hosting.md).

services:
  lotse:
    image: ${LOTSE_IMAGE:-ghcr.io/lotse-dev/lotse:latest}
    build: ..
    restart: unless-stopped
    # Host networking: the sandbox gateway publishes previews on the host's loopback address only,
    # and the builder must reach them there.
    network_mode: host
    user: "1000:${DOCKER_GID:-999}"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      LOTSE_HOST: 127.0.0.1
      LOTSE_PORT: "4780"
      LOTSE_AUTH: oidc
      LOTSE_DATABASE_URL: postgres://lotse:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@127.0.0.1:5432/lotse
      # Same path inside and outside: sandboxes mount project folders by their path on the host.
      LOTSE_DATA_DIR: ${LOTSE_DATA_DIR:-/srv/lotse}
    volumes:
      - ${LOTSE_DATA_DIR:-/srv/lotse}:${LOTSE_DATA_DIR:-/srv/lotse}
      # The container engine that runs the sandboxes. Whoever controls this socket controls the host;
      # prefer a rootless Docker or Podman socket (docs/self-hosting.md).
      - ${LOTSE_ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lotse
      POSTGRES_DB: lotse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lotse", "-d", "lotse"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db:
