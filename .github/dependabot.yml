# Automated dependency updates (specification section 13.1, supply chain).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Node.js 22 is the lowest supported version; its types must not describe newer APIs.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image stays on the Node.js line the project supports; moving it is a deliberate change.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
