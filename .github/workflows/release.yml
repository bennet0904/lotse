# Releases: tagged vX.Y.Z. Runs the full test suite including end-to-end tests,
# publishes the npm packages with provenance, the web app image and the desktop
# installers, each with an SBOM and a Sigstore signature.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint && pnpm typecheck && pnpm build
      - run: pnpm test:unit && pnpm test:contract && pnpm test:integration
      - name: End-to-end tests (prompt to deployment on a fresh server, UI, desktop app)
        run: |
          scripts/test-server.sh up ubuntu
          LOTSE_TEST_SSH_HOST="$(scripts/test-server.sh ip ubuntu)" xvfb-run -a pnpm test:e2e

  npm:
    name: npm packages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm build
      # Publishes every public package whose version is not on the registry yet: core, CLI and builder
      # share one version, adapters have their own.
      - run: pnpm -r publish --access public --no-git-checks --provenance --report-summary && cat pnpm-publish-summary.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Every public package is on the registry
        run: |
          missing=0
          for manifest in packages/*/package.json; do
            read -r name version private < <(node -p "const p=require('./$manifest'); [p.name, p.version, Boolean(p.private)].join(' ')")
            [ "$private" = true ] && continue
            found=""
            for attempt in 1 2 3 4 5 6; do
              found="$(npm view "$name@$version" version 2>/dev/null || true)"
              [ -n "$found" ] && break
              sleep 10
            done
            if [ -z "$found" ]; then echo "::error::$name@$version is not on the npm registry"; missing=1; else echo "$name@$version published"; fi
          done
          exit $missing
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-npm.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-npm
          path: sbom-npm.cdx.json

  image:
    name: Web app image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/lotse
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM and SLSA provenance are attached to the image as attestations.
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless, Sigstore)
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/lotse@${{ steps.build.outputs.digest }}"

  desktop:
    name: Desktop app (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Installers, signed where certificates are configured
        shell: bash
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Secrets that are not configured arrive as empty strings; electron-builder would read an empty
          # CSC_LINK as a path. Without a certificate, build unsigned installers instead.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          if [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          cd packages/desktop
          node scripts/bundle.mjs
          notarize=false
          if [ "$RUNNER_OS" = macOS ] && [ -n "$APPLE_ID" ]; then notarize=true; fi
          pnpm exec electron-builder --config electron-builder.yml --publish never -c.mac.notarize=$notarize
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.exe
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [npm, image, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Only the installers and SBOMs; other jobs leave artifacts too (e.g. Docker build records).
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: sbom-*
          path: dist
          merge-multiple: true
      - uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom-desktop.spdx.json
          upload-artifact: false
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign the checksums (keyless, Sigstore)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Versions before 1.0 and versions with a suffix (v1.2.0-rc.1) are marked as pre-releases.
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
