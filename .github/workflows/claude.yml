# Claude works on issues and pull requests of this repository:
#   - mention @claude in an issue, a comment or a review, or
#   - add the label "claude" to an issue.
# Only people with write access to the repository can trigger it. Claude opens pull
# requests; it never merges. Guidelines for its work are in CLAUDE.md.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

permissions:
  contents: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # to read CI results on pull requests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # The workspace is ready to build and test before Claude starts.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm build
      - uses: anthropics/claude-code-action@v1
        with:
          # One of the two: an API key, or a token of a Claude subscription (`claude setup-token`).
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          claude_args: |
            --allowedTools "Bash(pnpm install:*),Bash(pnpm build:*),Bash(pnpm typecheck:*),Bash(pnpm lint:*),Bash(pnpm format:*),Bash(pnpm schema:*),Bash(pnpm test:*),Bash(pnpm exec vitest:*),Bash(pnpm --filter:*),Bash(node scripts/:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
