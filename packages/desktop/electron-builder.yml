# Packaging of the desktop app. `pnpm --filter @lotseai/desktop dist` bundles the
# main process (scripts/bundle.mjs) and builds installers for the current
# platform. Signing uses the usual electron-builder variables (CSC_LINK,
# CSC_KEY_PASSWORD; APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID for
# notarization); the release workflow sets them.
appId: dev.lotse.desktop
productName: Lotse
copyright: Copyright © The Lotse contributors
directories:
  app: bundle
  output: release
  # The app icons; scripts/icons.py generates them from build/logo.svg.
  buildResources: build
files:
  - "**/*"
  - "!**/*.map"
  # Everything the app needs is in the bundle; electron-builder would otherwise add the workspace's node_modules.
  - "!node_modules{,/**/*}"
asar: true
npmRebuild: false
electronLanguages: [en-US, de]
mac:
  category: public.app-category.developer-tools
  # Separate builds for Apple silicon and Intel instead of one universal app: a universal app carries
  # Electron twice and is nearly twice as large for everyone. The bundle has no native modules, so the
  # arm64 runner builds the x64 app as well.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # electron-builder leaves the architecture out of x64 file names by default; always name it.
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  icon: build/icon.icns
  notarize: false
win:
  target: [nsis]
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  icon: build/icon.png
  category: Development
  maintainer: The Lotse contributors
  synopsis: Build apps from a prompt and publish them anywhere
publish: null
